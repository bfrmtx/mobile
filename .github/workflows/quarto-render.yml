name: Quarto render

on:
  push:
    branches:
      - main
    paths:
      - 'quarto/**'
      - 'doc/**'
      - '.github/workflows/quarto-render.yml'
  pull_request:
    paths:
      - 'quarto/**'
      - '.github/workflows/quarto-render.yml'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto project
        working-directory: quarto
        run: quarto render