project:
  type: book
  output-dir: ../doc
  preview:
    navigate: false
    watch-inputs: false

book:
  title: "Mobile WebInterface"
  date: last-modified
  sidebar:
    collapse-level: 3
  chapters:
    - index.qmd
    - part: "Databases"
      chapters:
        - qmd/databases/databases.qmd
    - part: "Flows"
